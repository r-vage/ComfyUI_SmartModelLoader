# Optional runtime discovery, device cleanup, and legacy progress adapters are
# intentionally defensive and preserve ComfyUI-owned types and names.
"core/common.py" = [
    "ARG002", "BLE001", "C901", "DTZ005", "E501", "ERA001", "FBT003",
