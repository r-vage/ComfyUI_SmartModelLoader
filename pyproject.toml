[project]
name = "ComfyUI_SmartModelLoader"
description = "Complete ComfyUI diffusion pipeline with secure model loading, text conditioning, pipe sampling, and verified downloads."
version = "1.0.6"
license = {file = "LICENSE"}
dependencies = [
    "torch",
    "numpy",
    "safetensors>=0.4,<0.9",
    "requests",
    "aiohttp",
    "huggingface_hub>=0.30,<2",
    "gguf>=0.6,<0.20",
    "tqdm",
    "einops",
]

[project.urls]
Repository = "https://github.com/r-vage/ComfyUI_SmartModelLoader"

[tool.comfy]
PublisherId = "rvage"
DisplayName = "ComfyUI Smart Model Loader"
Icon = "https://raw.githubusercontent.com/r-vage/ComfyUI_SmartModelLoader/refs/heads/main/Readme/icon_eclipse.png"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Ruff's preferred docstring layouts are mutually exclusive.
    "D203",
    "D213",
    # This repository has no per-file copyright-header policy.
    "CPY001",
    # Package-relative imports are intentional for ComfyUI custom-node loading.
    "TID252",
    # Moving every dynamic message into a dedicated exception class would add
    # churn without improving the public error contract.
    "EM101",
    "EM102",
    "EM103",
    # Published exception names are part of the downloader API.
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D101", "D102", "D103", "D104", "E402", "PGH003", "PLC0415"]
# Core helpers cross an intentionally dynamic ComfyUI/plugin boundary. Missing
# annotations and public-docstring rules are not useful where runtime-owned
# objects have no stable importable protocol; existing annotations remain linted.
"core/**/*.py" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
